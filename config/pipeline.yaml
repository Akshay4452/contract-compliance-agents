# Pipeline knobs (Day 5+). Secrets stay in .env — not here.

compliance:
  model: "gpt-4o-mini"
  temperature: 0
  top_k: 5
  # Optional cap for smoke runs; omit or null = all clauses
  # max_clauses: 1

# Day 6 — deterministic verifier (no LLM)
verifier:
  min_confidence: 0.5
  # Whitespace-normalized substring match when exact match fails
  fuzzy_quote: true

# Day 7 — reporter artifacts (no LLM); human gate defaults to pending_review
reporter:
  output_dir: "data/exercises/day7_reporter"
