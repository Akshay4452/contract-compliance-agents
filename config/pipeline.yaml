# Pipeline knobs (Day 5+). Secrets stay in .env — not here.

compliance:
  model: "gpt-4o-mini"
  temperature: 0
  top_k: 5
  # Bump when editing src/prompts/compliance_*.txt (logged to MLflow)
  prompt_version: "v1"
  # Optional cap for smoke runs; omit or null = all clauses
  # max_clauses: 1

# Day 6 — deterministic verifier (no LLM)
verifier:
  min_confidence: 0.5
  # Whitespace-normalized substring match when exact match fails
  fuzzy_quote: true

# Day 7 — reporter artifacts (no LLM); human gate defaults to pending_review
reporter:
  output_dir: "data/exercises/day7_reporter"

# Day 8 — golden eval harness (see eval/run_eval.py)
eval:
  golden_path: "data/golden/compliance_cases.jsonl"
  contracts_index: "data/golden/contracts_index.yaml"
  output_json: "data/exercises/day8_eval/last_eval.json"
  report_dir: "data/exercises/day8_eval/reports"
  cuad_limit: 5
  clause_count_tolerance: 0.25

# Day 9 — MLflow experiment tracking (eval metrics, not training)
mlflow:
  enabled: false
  experiment_name: "contract-compliance-eval"
  # SQLite under mlruns/ (gitignored). Bare path "mlruns" → mlruns/tracking.db.
  tracking_uri: "mlruns"

# Day 10 — OpenTelemetry (one trace = one contract run)
otel:
  enabled: false
  service_name: "contract-compliance-agents"
  # console | otlp | file | console+otlp (combine with +)
  exporter: "console"
  # Jaeger all-in-one OTLP HTTP default
  endpoint: "http://127.0.0.1:4318/v1/traces"
  # Always useful offline deliverable when tracing is on
  export_path: "data/exercises/day10_otel/last_trace.jsonl"
